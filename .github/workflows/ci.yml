name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Build, lint and unit-test on every platform the tool runs on, with the
  # oldest Rust we support (rust-version in Cargo.toml).
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets
      - run: cargo test --locked
      - run: cargo build --locked --release
      - uses: actions/upload-artifact@v4
        with:
          name: boot-craft-${{ runner.os }}
          path: |
            target/release/boot-craft
            target/release/boot-craft.exe
          if-no-files-found: error

  # Intel Macs: compile only (the runners are Apple Silicon).
  macos-intel:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --target x86_64-apple-darwin

  # The newest stable Rust, so new lints and breakage show up early.
  stable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets
      - run: cargo test

  # Real writes, on loop devices (files posing as drives): no real drive is touched.
  loop-device:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get install -y dosfstools
      - run: cargo build --locked
      - run: sudo scripts/loop-test.sh

  # Real writes on macOS, to a RAM disk: no real drive is touched.
  macos-disk:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      - run: sudo scripts/macos-test.sh

  # Real writes on Windows, to a VHD attached as a disk: no real drive is touched.
  windows-disk:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      - run: ./scripts/windows-test.ps1
        shell: pwsh

  # A written drive really boots: Alpine, from BIOS and UEFI, in QEMU.
  boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 ovmf
      - run: cargo build --locked
      - run: sudo scripts/boot-test.sh


  windows-usb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y genisoimage wimtools grub-efi-amd64-bin dosfstools qemu-system-x86 ovmf
      # The unit tests that need wimlib, genisoimage and fsck.fat, now that they're installed.
      - run: PATH=$PATH:/usr/sbin cargo test --locked -p bc-core -- winusb fat32
      - run: cargo build --locked
      # The runner's /mnt has room for the 4 GiB+ install.wim test.
      - run: sudo mkdir -p /mnt/work && sudo env BIG=1 WORK_ROOT=/mnt/work scripts/windows-usb-test.sh
