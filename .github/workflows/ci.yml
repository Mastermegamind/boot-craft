name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Build, lint and unit-test on every platform the tool runs on, with the
  # oldest Rust we support (rust-version in Cargo.toml).
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets
      - run: cargo test --locked
      - run: cargo build --locked --release
      - uses: actions/upload-artifact@v4
        with:
          name: rust-rufus-${{ runner.os }}
          path: |
            target/release/rust-rufus
            target/release/rust-rufus.exe
          if-no-files-found: error

  # Intel Macs: compile only (the runners are Apple Silicon).
  macos-intel:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --target x86_64-apple-darwin

  # The newest stable Rust, so new lints and breakage show up early.
  stable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets
      - run: cargo test

  # Real writes, on loop devices (files posing as drives): no real drive is touched.
  loop-device:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get install -y dosfstools
      - run: cargo build --locked
      - run: sudo scripts/loop-test.sh
