[package]
name = "bc-core"
description = "Drive discovery, safety rules, image inspection and writing for boot-craft"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bzip2 = "0.6.1"
crc32fast = "1.5"
fatfs = { version = "0.3.6", default-features = false, features = ["std", "alloc"] }
ntfs = "0.4"
flate2 = "1.1.11"
lzma-rs = "0.3.0"
# 0.8 needs Rust 1.87 despite declaring 1.85
ruzstd = "=0.7.3"
sha2.workspace = true
thiserror.workspace = true
zip = { version = "7.3.0", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1.8.0"

[dev-dependencies]
flate2 = "1.1.11"
plist = "1.8.0"
tempfile.workspace = true
