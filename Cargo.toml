[workspace]
resolver = "3"
members = ["crates/rr-core", "crates/rr-cli", "crates/rr-mcp"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
